name: fans-staging

services:
  frontend:
    build:
      context: ../../../fans-next
      args:
        ENV_FILE: .env.staging
    container_name: fans-staging-frontend
    env_file:
      - path: ../../../fans-next/.env.staging
        required: true
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3001').then((res)=>process.exit(res.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - fans_edge

  backend:
    build:
      context: ../..
      args:
        INSTALL_FFMPEG: "false"
    container_name: fans-staging-backend
    env_file:
      - path: ../../.env.staging
        required: true
    volumes:
      - staging_backend_uploads:/app/uploads
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3000/api/health').then((res)=>process.exit(res.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - fans_edge

volumes:
  staging_backend_uploads:

networks:
  fans_edge:
    external: true
    name: fans-prod_default
